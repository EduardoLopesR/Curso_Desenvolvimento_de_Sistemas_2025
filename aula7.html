<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Online</title>
    <style>
    body {
        background-color: rgb(17, 84, 108);
        margin: 0;
        font-family: Arial, sans-serif;
}
    .container {
        background-color: white;
        width: 400px;
        margin: 50px auto; /* centraliza horizontalmente */
        padding: 30px;
        border-radius: 10px;
        text-align: center;
}
    input[type="number"] {
        border-radius: 20px;   /* deixa arredondado */
        padding: 10px;
        border: 1px solid #020506;
}
    </style>
</head>
<body>
    <div class="container">

    <h1>Calculadora</h1>
    <input type="number" id="num1" placeholder="Primeiro número">
    <input type="number" id="num2" placeholder="Segundo número">

    <p>Tipo de operação:</p>
    <button onclick="adicao()">+</button>
    <button onclick="subtracao()">-</button>
    <button onclick="divisao()">/</button>
    <button onclick="multi()">x</button>
    <p id="resultado"></p>

</div>
</body>
<script src="aula7.js"></script>
</html>
