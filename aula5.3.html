<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com Validação</title>
    <style>
        .container{
        width: 400px;
        margin: 50px auto; 
        padding: 30px;
        border-radius: 10px;
        text-align: center;  
        }    
        .botao{
        margin: 10px;
        }
        ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Lista de produtos</h1>
    <p>Nome do produto: </p>
    <input type="text" name="nome" id="nome">
    <p>Quantidade do produto: </p>
    <input type="text" name="quantidade" id="qntd">
    <p>Valor do produto: </p>
    <input type="text" name="valor" id="valor">
    <br>
    <div class="botao">
        <button onclick="lista()">Gerar lista</button>
    </div>
    <ul id="resultado"></ul>
    </div>
</body>
<script src="aula5.3.js"></script>
</html>
